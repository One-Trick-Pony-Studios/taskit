name: taskit
description: "App to easily create tasks or events from any selected text in other apps."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  smooth_page_indicator: ^2.0.1
  flutter_svg: ^2.2.1 
  video_player: ^2.10.0 
  device_info_plus: ^13.2.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/icons/app_icon.svg
    - assets/homepage/calendar.png
    - assets/homepage/calendar_optimized.gif
    - assets/onboarding/

  fonts:
      - family: RhodiumLibre
        fonts:
          - asset: assets/fonts/RhodiumLibre-Regular.ttf

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true