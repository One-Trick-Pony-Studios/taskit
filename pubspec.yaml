name: taskit
description: "App to easily create tasks or events from any selected text in other apps."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  receive_sharing_intent:
    git:
      url: https://github.com/KasemJaffer/receive_sharing_intent
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.7 
  video_player: ^2.7.2 
  device_info_plus: ^12.1.0
  url_launcher: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/icons/app_icon.svg
    - assets/homepage/calendar_gif.gif
    - assets/homepage/calendar_optimized.gif
    - assets/onboarding/pixel8_front.png
    - assets/onboarding/onboarding_blur_1.mp4
    - assets/onboarding/onboarding_blur_2.mp4
    - assets/onboarding/shareit.png
    - assets/onboarding/taskit.png

  fonts:
      - family: RhodiumLibre
        fonts:
          - asset: assets/fonts/RhodiumLibre-Regular.ttf

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true